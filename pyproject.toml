[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eit-benchlab"
version = "0.1.0"
description = "Electrical impedance tomography with P1 FEM, discrete adjoints and TV reconstruction"
readme = "README.md"
license = {text = "See LICENSE and THIRD_PARTY_NOTICES.md for component-specific notices."}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "pydantic>=2,<3",
    "PyYAML>=6",
]

[project.optional-dependencies]
viz = ["pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
eit = "eitbench.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eitbench*"]

[tool.setuptools.package-data]
eitbench = ["_provenance/*.json", "_provenance/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
